name: healthcare_mobile
description: Healthcare app - user side. Google OAuth + India phone (Airtel/Jio/Vi, no VoIP).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_functions: ^5.1.3
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#0E8388"
  android_12:
    color: "#0E8388"
    icon_background_color: "#0E8388"
