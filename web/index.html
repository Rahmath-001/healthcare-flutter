<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by the value of `flutter build --base-href` when the app is served
    from a sub-path rather than the domain root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Book doctors, hold video consultations and keep your medical records in one place.">
  <meta name="theme-color" content="#0E8388">

  <!--
    Google Sign-In on web does NOT read android/app/google-services.json or
    lib/firebase_options.dart for its client id: it needs the Web OAuth client
    id declared here, or sign-in fails at runtime with no useful error.

    Take it from Google Cloud console -> APIs & Services -> Credentials ->
    "Web client (auto created by Google Service)", then uncomment:

    <meta name="google-signin-client_id" content="XXXX.apps.googleusercontent.com">
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MiDoctor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MiDoctor</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
